name: Run Workflows Weekly

# The purpose of this CI file is to stress test our workflows at scale.
# The *_weekly.wic workflows scatter over a much larger number of examples.
# Note that toil-cwl-runner is slightly slower than cwltool, but
# there are deadlocking problems with `cwltool --parallel`

on:
  # push:  # Do NOT run weekly workflows on every push!
  # pull_request: (either on origin or on upstream pull request)
  schedule:
  # Instead, run it every Tuesday at midnight.
    - cron: '0 0 * * 2'
  workflow_dispatch:
    # The corpus repositories to run against. Empty means the fork's default
    # branch, which is what `schedule` runs. Named so a sophios branch and an
    # mm-workflows branch with the same name can be run against each other
    # here as well as in run_workflows.yml (see branch_dispatch.md).
    inputs:
      mm-workflows_owner:
        description: The account name of the mm-workflows repository
        required: false
        type: string
        default: ''
      mm-workflows_ref:
        description: The branch name within the mm-workflows repository
        required: false
        type: string
        default: ''
      image-workflows_owner:
        description: The account name of the image-workflows repository
        required: false
        type: string
        default: ''
      image-workflows_ref:
        description: The branch name within the image-workflows repository
        required: false
        type: string
        default: ''

defaults:
  run:
    shell: bash -l {0} # Invoke bash in login mode, NOT interactive mode.
    # This will cause bash to look for the startup file ~/.bash_profile, NOT ~/.bashrc
    # This is important since conda init writes to ~/.bashrc

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  run_weekly_toil:
    # See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency
    # This will prevent DOS attacks from people blasting the CI with rapid fire commits.
    concurrency:
      group: ${{ github.workflow }}-weekly-toil-${{ github.ref }}
      cancel-in-progress: true
    runs-on: [self-hosted, linux]
    # A workflow that runs away fails the lane at 4 h instead of holding the runner
    # for GitHub's default of 6 h.
    timeout-minutes: 240

    steps:
    - name: Checkout sophios
      uses: actions/checkout@v5
      with:
        repository: ${{ github.repository_owner }}/sophios
        # The triggering ref, not a literal branch. On `schedule` that is the
        # default branch, so the weekly still runs master; on
        # `workflow_dispatch` it is the branch chosen in the UI, which a
        # literal `master` here silently ignored -- the run reported itself
        # against the dispatched sha and tested master anyway.
        ref: ${{ github.ref }}
        path: sophios

    - name: Checkout biobb_adapters
      if: always()
      uses: actions/checkout@v5
      with:
        repository: vjaganat90/biobb_adapters
        ref: master
        path: biobb_adapters

    - name: Checkout mm-workflows
      if: always()
      uses: actions/checkout@v5
      with:
        repository: ${{ inputs.mm-workflows_owner || github.repository_owner }}/mm-workflows
        ref: ${{ inputs.mm-workflows_ref || 'main' }}
        path: mm-workflows

    - name: Checkout image-workflows
      if: always()
      uses: actions/checkout@v5
      with:
        repository: ${{ inputs.image-workflows_owner || github.repository_owner }}/image-workflows
        ref: ${{ inputs.image-workflows_ref || 'main' }}
        path: image-workflows

    - name: Prune the Docker build cache
      if: always()
      # Images the corpus builds on the fly (`dockerFile:` hints) leave their
      # build cache behind on the self-hosted runner: 41 GB of it by 2026-10,
      # on a disk toil then found too full to schedule a job on.
      run: docker builder prune -af | tail -1

    - name: Mark the start of the lane
      if: always()
      # The cleanup at the end removes only what the lane created after this.
      run: touch "$RUNNER_TEMP/lane_started"

    - name: Disk usage (before setup)
      if: always()
      run: |
        df -h / | tail -1
        docker system df | tail -4
        # Paths the lane has not created yet are missing before setup; the login shell has pipefail.
        du -sh sophios/autogenerated /tmp/toilwf-* "/home/$(whoami)/.toil" 2>/dev/null | sort -h | tail -8 || true

    - name: Remove old global config
      if: always()
      run: rm -rf "/home/$(whoami)/wic/" && rm -rf "/home/$(whoami)/.toil/"
      # For self-hosted runners, make sure we use new global config settings

    - name: Remove old mamba environment
      if: always()
      run: rm -rf "/home/$(whoami)/miniconda3/envs/wic_github_actions/"
      # For self-hosted runners, make sure we install into a new mamba environment
      # Completely moving away from pypy

    - name: Setup miniforge (linux, macos)
      if: always()
      uses: conda-incubator/setup-miniconda@v4.0.1
      with:
        miniforge-variant: Miniforge3
        miniforge-version: 24.7.1-2
        environment-file: sophios/install/system_deps.yml
        activate-environment: wic_github_actions
        use-mamba: true
        channels: conda-forge
        python-version: "3.11.*"
        # The post step of this action moves every extracted package out of the
        # pkgs directory, so the next job on this self-hosted runner, in any
        # lane, re-extracts them all: Setup takes 4.7 min after a job whose
        # post step ran and 0.5 min after one whose did not. The runner keeps
        # the pkgs directory as its cache instead.
        run-post: false

    # - name: Docker pull
    #   if: always()
    #   run: cd mm-workflows/ && ./dockerPull.sh
    #   # For self-hosted runners, make sure the docker cache is up-to-date.

    - name: Install Sophios
      if: always()
      run: cd sophios/ && pip install ".[all_except_runner_src]"

    - name: Update Sophios Config
      if: always()
      run: cd sophios/ && python .github/update_sophios_config.py

    - name: Install Molecular Modeling Workflows
      if: always()
      # Also run mm-workflows command to generate
      # mm-workflows/autogenerated/schemas/config_schemas.json
      # NOTE: Use ".[test]" instead of ".[all_except_runner_src]"
      # We do not want or need to install the workflow_deps extra.
      # (Many of the packages conflict with pypy.)
      run: cd mm-workflows/ && pip install ".[test]" && mm-workflows --generate_schemas

    - name: Generate Sophios Python API Workflows (*.py -> *.wic)
      if: always()
      run: cd sophios/ && pytest tests/core/test_python_api_workflow.py -k test_compile_python_workflows

    - name: Generate Sophios Validation Jsonschema
      if: always()
      run: cd sophios/ && sophios --generate_schemas

      # Please read docs/validation.md#Property-Based-Testing
      # This is essentially an integration test for all of the
      # Sophios Python API workflows as well as the WIC Python API itself.
    - name: Validate Sophios Python API Workflows (*.py -> *.wic)
      if: always()
      run: cd sophios/ && pytest tests/core/test_python_api_workflow.py -k test_validate_generated_python_workflows

    - name: PyTest Tool Builder
      if: always()
      run: cd sophios/ && pytest tests/core/test_python_api_tool_builder.py

    - name: PyTest Run Workflows (On Push)
      if: always()
      # NOTE: Do NOT add coverage to PYPY CI runs https://github.com/tox-dev/tox/issues/2252
      run: cd sophios/ && pytest -k test_run_workflows_on_push --workers 8 --cwl_runner toil-cwl-runner --durations=0 # --cov

    - name: Disk usage (after workflows (on push))
      if: always()
      run: |
        df -h / | tail -1
        docker system df | tail -4
        # Paths the lane has not created yet are missing before setup; the login shell has pipefail.
        du -sh sophios/autogenerated /tmp/toilwf-* "/home/$(whoami)/.toil" 2>/dev/null | sort -h | tail -8 || true

    - name: PyTest Run Inlined Workflows (On Push)
      if: always()
      # NOTE: Do NOT add coverage to PYPY CI runs https://github.com/tox-dev/tox/issues/2252
      run: cd sophios/ && pytest -k test_run_inlined_workflows_on_push --workers 8 --cwl_runner toil-cwl-runner --durations=0 # --cov

    - name: Disk usage (after inlined (on push))
      if: always()
      run: |
        df -h / | tail -1
        docker system df | tail -4
        # Paths the lane has not created yet are missing before setup; the login shell has pipefail.
        du -sh sophios/autogenerated /tmp/toilwf-* "/home/$(whoami)/.toil" 2>/dev/null | sort -h | tail -8 || true

    - name: PyTest Run Workflows (Weekly)
      if: always()
      # NOTE: Do NOT add coverage to PYPY CI runs https://github.com/tox-dev/tox/issues/2252
      run: cd sophios/ && pytest -k test_run_workflows_weekly --workers 8 --cwl_runner toil-cwl-runner --durations=0 # --cov

    # The flat and the embedded forms of the weekly workflows, checked at
    # compile time; the pull-request lanes skip these workflows as large.

    - name: Disk usage (after workflows (weekly))
      if: always()
      run: |
        df -h / | tail -1
        docker system df | tail -4
        # Paths the lane has not created yet are missing before setup; the login shell has pipefail.
        du -sh sophios/autogenerated /tmp/toilwf-* "/home/$(whoami)/.toil" 2>/dev/null | sort -h | tail -8 || true

    - name: PyTest Inline Forms Keep Meaning (Weekly)
      if: always()
      run: cd sophios/ && pytest tests/core/test_examples.py -k test_weekly_corpus

    - name: PyTest Run Inlined Workflows (Weekly)
      if: always()
      # NOTE: Do NOT add coverage to PYPY CI runs https://github.com/tox-dev/tox/issues/2252
      run: cd sophios/ && pytest -k test_run_inlined_workflows_weekly --workers 8 --cwl_runner toil-cwl-runner --durations=0 # --cov

    - name: Disk usage (after inlined (weekly))
      if: always()
      run: |
        df -h / | tail -1
        docker system df | tail -4
        # Paths the lane has not created yet are missing before setup; the login shell has pipefail.
        du -sh sophios/autogenerated /tmp/toilwf-* "/home/$(whoami)/.toil" 2>/dev/null | sort -h | tail -8 || true

    - name: Remove what the lane left on the runner
      if: always()
      # Job stores and outputs under autogenerated/, toil's work directories
      # under /tmp and its history, from this run only: a failure such as a
      # full disk (Errno 28) must not leave them for the next job to trip on.
      run: |
        rm -rf sophios/autogenerated
        find /tmp -maxdepth 1 -name 'toilwf-*' -newer "$RUNNER_TEMP/lane_started" -exec rm -rf {} +
        rm -rf "/home/$(whoami)/.toil"
        df -h / | tail -1
